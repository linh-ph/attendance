# Docker-first. `node_modules` lives in a named volume in every service, so the
# host never needs a matching Node — see CLAUDE.md.
#
# This file covers development and verification only: `app` to work against and
# `test` to prove the change. The production image gets its own compose file.
services:
  # The app you work against. The source is bind-mounted and Next's dev server
  # watches it, so a change on the host is live without a rebuild.
  #
  # `NEXT_PUBLIC_*` need no build args here: the dev server compiles on demand
  # and reads them from the environment. They are only build-time for the
  # production image, which this file does not build.
  app:
    build:
      context: .
      target: deps
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    env_file: .env
    environment:
      # Polling is slower but survives every bind-mount driver; without it a
      # host edit can go unnoticed on macOS and Windows.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  # The test runner: lint, typecheck, Vitest, the production build, and
  # Playwright. It carries Chromium, which is why the image is large.
  test:
    build:
      context: .
      target: test
    env_file: .env
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules

volumes:
  app_node_modules:
  test_node_modules:
