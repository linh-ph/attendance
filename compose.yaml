services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:?Set NEXT_PUBLIC_GOOGLE_PICKER_API_KEY in .env}
        NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER:?Set NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER in .env}
    env_file: .env
    ports:
      - "3000:3000"

  test:
    build:
      context: .
      target: test
    env_file: .env
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules

volumes:
  test_node_modules:
