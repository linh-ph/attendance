# Docker-first. `node_modules` lives in a named volume, so the host never needs
# a matching Node — see CLAUDE.md.
#
# One service. `app` is both what you work against and what you run the checks
# in: the source is bind-mounted, so `docker compose run --rm app npm run
# verify` sees the current files. The production image gets its own compose
# file.
#
# Playwright is the exception. The `deps` target carries no Chromium, so
# `npm run test:e2e` needs the Dockerfile's `test` stage instead. It needs no
# `.env`: `playwright.config.ts` starts its own dev server with its own
# local-only environment.
#
#   docker build --target test -t attendance-e2e .
#   docker run --rm -v "$PWD:/app" -v /app/node_modules \
#     attendance-e2e npm run test:e2e
services:
  # The source is bind-mounted and Next's dev server watches it, so a change on
  # the host is live without a rebuild.
  #
  # `NEXT_PUBLIC_*` need no build args here: the dev server compiles on demand
  # and reads them from the environment. They are only build-time for the
  # production image, which this file does not build.
  app:
    build:
      context: .
      target: deps
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    env_file: .env
    environment:
      # Polling is slower but survives every bind-mount driver; without it a
      # host edit can go unnoticed on macOS and Windows.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5

  # A Postgres *client*, not a database. Nothing runs locally — the schema lives
  # in Supabase — but applying a migration needs `psql`, and neither the host
  # nor the `app` image has one. Declaring it here keeps that out of ad-hoc
  # `docker run` invocations, where the connection details get retyped and the
  # password ends up on a command line.
  #
  # Behind a profile, so `docker compose up` never starts it:
  #
  #   docker compose run --rm psql -f /migrations/<file>.sql   # apply
  #   docker compose run --rm psql -c "select 1"               # ad-hoc query
  #
  # It reaches Supabase through the IPv4 pooler. The direct host
  # (`db.<ref>.supabase.co`) is IPv6-only and unreachable from a machine with no
  # IPv6 route, which is why SUPABASE_DB_HOST names the pooler instead — and why
  # its region is the pooler's, which need not match where the project appears
  # to live.
  psql:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: ${SUPABASE_DB_HOST:-}
      PGPORT: "5432"
      PGUSER: postgres.${SUPABASE_PROJECT_REF:-}
      PGDATABASE: postgres
      PGPASSWORD: ${DATABASE_PASSWORD:-}
      PGCONNECT_TIMEOUT: "10"
      # A migration that fails halfway leaves a schema neither version
      # describes, so stop on the first error and wrap the file in one
      # transaction.
      PSQLRC: /dev/null
    entrypoint: ["psql", "-w", "-v", "ON_ERROR_STOP=1", "--single-transaction"]
    volumes:
      - ./supabase/migrations:/migrations:ro

volumes:
  app_node_modules:
